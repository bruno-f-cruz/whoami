name: "Validate WhoAmI registry"

on:
  pull_request:
    paths:
      - 'whoami.yml'
      - 'whoami.json'
      - 'submissions/**'
      - 'scripts/**'
      - 'tests/**'
      - 'site/**'
      - 'package.json'
      - '.github/workflows/validate-whoami.yml'
      - '.github/workflows/fold-submissions.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fold submissions into the registry
        run: node scripts/fold-submissions.mjs --out "$RUNNER_TEMP/whoami.yml"

      - name: Validate whoami.yml
        run: |
          git show "origin/${{ github.base_ref }}:whoami.yml" > "$RUNNER_TEMP/base.yml"
          uv run scripts/validate_whoami.py "$RUNNER_TEMP/whoami.yml" --base "$RUNNER_TEMP/base.yml" --schema whoami.json

      - name: Validator tests
        run: uv run --no-project --with pytest --with pyyaml==6.0.2 --with jsonschema==4.23.0 pytest tests -q

      - name: Form logic tests
        run: npm test
