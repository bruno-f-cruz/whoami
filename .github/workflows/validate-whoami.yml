name: "Validate WhoAmI registry"

on:
  pull_request:
    paths:
      - 'whoami.yml'
      - 'whoami.json'
      - 'scripts/**'
      - 'tests/**'
      - 'site/**'
      - 'package.json'
      - '.github/workflows/validate-whoami.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Validate whoami.yml
        run: |
          git show "origin/${{ github.base_ref }}:whoami.yml" > "$RUNNER_TEMP/base.yml"
          uv run scripts/validate_whoami.py whoami.yml --base "$RUNNER_TEMP/base.yml" --schema whoami.json

      - name: Validator tests
        run: uv run --no-project --with pytest --with pyyaml==6.0.2 --with jsonschema==4.23.0 pytest tests -q
