name: "Fold WhoAmI submissions"

# Moves merged submissions/<whoami>.yml files into whoami.yml, then republishes the registry.
on:
  push:
    branches: [main]
    paths:
      - 'submissions/**.yml'
  workflow_dispatch:

concurrency:
  group: fold-submissions
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the folded registry
      actions: write  # dispatch the publish workflow (pushes by GITHUB_TOKEN do not trigger it)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fold submissions
        id: fold
        run: |
          {
            echo 'added<<EOF'
            node scripts/fold-submissions.mjs --write
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.fold.outputs.added }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A whoami.yml submissions
          if git diff --cached --quiet; then
            echo "No submissions to fold."
            exit 0
          fi
          git commit -m "Add WhoAmI $(echo "$ADDED" | paste -sd ', ')"
          git push
          gh workflow run registry.yml --ref main
